Naming/BlockParameterName:
  Excluded:
    - spec/**

Lint/NotNil:
  Excluded:
    - spec/**

Style/HeredocIndent:
  Excluded:
    - spec/**

# spec/test_project/ is the specs' Marten test app (models, migrations), not
# specs; renaming its files to *_spec.cr would make `crystal spec` run them.
Lint/SpecFilename:
  Excluded:
    - spec/test_project/**/*.cr
